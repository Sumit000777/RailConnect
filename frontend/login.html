<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — RailYatra</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="site-header">

    <a
      class="brand"
      href="index.html"
      style="color:inherit;text-decoration:none;"
    >

      <!-- Train Logo -->
      <img
        src="images/train-logo.jpg"
        class="brand-mark"
        alt="RailYatra Train Logo"
      >

      <!-- Website Name -->
      RailYatra

    </a>


    <div class="header-actions">

      <div class="theme-toggle">

        <button
          data-theme-btn="dark"
        >
          Dark
        </button>

        <button
          data-theme-btn="light"
        >
          Light
        </button>

      </div>


      <a
        class="btn btn-outline"
        href="signup.html"
      >
        Sign Up
      </a>

    </div>

  </header>


  <main class="auth-wrap">

    <div class="auth-card">

      <h1>
        Welcome back
      </h1>

      <p class="sub">
        Log in to view your bookings and reserve new tickets.
      </p>


      <div
        class="form-msg"
        id="formMsg"
      ></div>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          />

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
          />

        </div>


        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="submitBtn"
        >
          Log In
        </button>

      </form>


      <p class="auth-foot">

        Don't have an account yet?

        <a href="signup.html">
          Sign up
        </a>

      </p>

    </div>

  </main>


  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
