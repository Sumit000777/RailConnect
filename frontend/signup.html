<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — RailYatra</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="site-header">

    <a
      class="brand"
      href="index.html"
      style="color:inherit;text-decoration:none;"
    >

      <!-- Train Logo -->
      <img
        src="images/train-logo.jpg"
        class="brand-mark"
        alt="RailYatra Train Logo"
      >

      <!-- Website Name -->
      RailYatra

    </a>


    <div class="header-actions">

      <div class="theme-toggle">

        <button
          data-theme-btn="dark"
        >
          Dark
        </button>

        <button
          data-theme-btn="light"
        >
          Light
        </button>

      </div>


      <a
        class="btn btn-outline"
        href="login.html"
      >
        Log In
      </a>

    </div>

  </header>


  <main class="auth-wrap">

    <div class="auth-card">

      <h1>
        Create your account
      </h1>

      <p class="sub">
        Sign up with your email to start booking tickets.
      </p>


      <div
        class="form-msg"
        id="formMsg"
      ></div>


      <form id="signupForm">

        <div class="field">

          <label for="name">
            Full name
          </label>

          <input
            type="text"
            id="name"
            required
            autocomplete="name"
            placeholder="Aditi Sharma"
          />

        </div>


        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          />

        </div>


        <div class="field">

          <label for="phone">
            Phone number (optional)
          </label>

          <input
            type="tel"
            id="phone"
            autocomplete="tel"
            placeholder="98765 43210"
          />

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="At least 6 characters"
          />

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            type="password"
            id="confirmPassword"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Re-enter password"
          />

        </div>


        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="submitBtn"
        >
          Create Account
        </button>

      </form>


      <p class="auth-foot">

        Already have an account?

        <a href="login.html">
          Log in
        </a>

      </p>

    </div>

  </main>


  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
