<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Train Timings — RailYatra</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="site-header">

    <a
      class="brand"
      href="dashboard.html"
      style="color:inherit;text-decoration:none;"
    >

      <!-- Train Logo -->
      <img
        src="images/train-logo.jpg"
        class="brand-mark"
        alt="RailYatra Train Logo"
      >

      <!-- Website Name -->
      RailYatra

    </a>


    <div class="header-actions">

      <div class="theme-toggle">

        <button data-theme-btn="dark">
          Dark
        </button>

        <button data-theme-btn="light">
          Light
        </button>

      </div>

    </div>

  </header>


  <div class="app-shell">

    <aside class="sidebar">

      <nav>

        <a href="dashboard.html">
          ▣ Dashboard
        </a>

        <a
          href="train-timings.html"
          class="active"
        >
          🚆 Train Timings
        </a>

        <a href="history.html">
          🕘 Booking History
        </a>

        <div class="divider"></div>

        <a
          href="#"
          id="logoutLink"
        >
          ⎋ Logout
        </a>

      </nav>

    </aside>


    <main class="app-main">

      <div class="page-head">

        <div>

          <h1>
            Train Timings
          </h1>

          <p>
            Search across ~110 trains by station,
            train number, or train name.
          </p>

        </div>

      </div>


      <form
        class="search-form"
        id="searchForm"
      >

        <div class="field">

          <label for="from">
            From station
          </label>

          <input
            type="text"
            id="from"
            placeholder="e.g. New Delhi"
          />

        </div>


        <div class="field">

          <label for="to">
            To station
          </label>

          <input
            type="text"
            id="to"
            placeholder="e.g. Mumbai Central"
          />

        </div>


        <div class="field">

          <label for="number">
            Train number
          </label>

          <input
            type="text"
            id="number"
            placeholder="e.g. 12951"
          />

        </div>


        <div class="field">

          <label for="name">
            Train name
          </label>

          <input
            type="text"
            id="name"
            placeholder="e.g. Rajdhani"
          />

        </div>


        <button
          type="submit"
          class="btn btn-primary"
        >
          Search
        </button>

      </form>


      <div class="panel">

        <div class="panel-head">

          <h2 id="resultsHeading">
            All trains
          </h2>

          <span
            class="mono"
            id="resultsCount"
            style="color:var(--text-muted);font-size:0.82rem;"
          ></span>

        </div>


        <table>

          <thead>

            <tr>

              <th>
                No.
              </th>

              <th>
                Train
              </th>

              <th>
                Route
              </th>

              <th>
                Departs
              </th>

              <th>
                Arrives
              </th>

              <th>
                Duration
              </th>

              <th>
                Classes
              </th>

              <th>
                Fare from
              </th>

              <th></th>

            </tr>

          </thead>


          <tbody id="resultsBody"></tbody>

        </table>


        <div
          class="empty-state"
          id="resultsEmpty"
          style="display:none;"
        >

          <div class="glyph">
            🔍
          </div>

          No trains matched your search.
          Try a different station or train name.

        </div>

      </div>

    </main>

  </div>


  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/trains.js"></script>

</body>

</html>
